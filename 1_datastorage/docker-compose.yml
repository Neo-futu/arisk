version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fsi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsi_risk}
      POSTGRES_USER: ${POSTGRES_USER:-fsi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsi_user}"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fsi_timescale
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-fsi_timeseries}
      POSTGRES_USER: ${POSTGRES_USER:-fsi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - ts_data:/var/lib/postgresql/data
      - ./timeseries:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: fsi_redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: fsi_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  ts_data:
  redis_data:
  minio_data:
