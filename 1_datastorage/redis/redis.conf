bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 持久化（快照 + AOF）
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 記憶體策略（緩存用途：LRU 淘汰）
maxmemory 512mb
maxmemory-policy allkeys-lru

# 日誌
loglevel notice
logfile ""

# 資料庫分區用途：
#  DB 0 - 市場行情緩存（TTL 60s）
#  DB 1 - Celery broker
#  DB 2 - Celery results
#  DB 3 - 會話/Token 緩存
#  DB 4 - NAV 實時緩存（TTL 300s）
databases 16
