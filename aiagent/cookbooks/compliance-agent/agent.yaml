# ARISK 合規 Agent — Managed Agent 部署範本
name: arisk-compliance-agent
model: claude-sonnet-4-6

system:
  file: ../../agents/compliance-officer.md
  append: |
    你正在 headless 模式下運行。
    最終合規報告輸出到 ./out/ 目錄（由 compliance-writer 子 Agent 生成）。

tools:
  - type: agent_toolset
    configs: [read, grep]

fsi_tools:
  - get_exposure
  - get_positions

callable_agents:
  - manifest: ./subagents/data-reader.yaml
  - manifest: ./subagents/compliance-writer.yaml   # 唯一有寫入的葉節點
