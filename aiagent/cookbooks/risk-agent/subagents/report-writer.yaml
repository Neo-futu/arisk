# 報告寫入子 Agent — 唯一有 Write 權限的葉節點
# 對應 claude-risk-agent 的 deck-writer 模式（只有葉節點可以輸出）
name: risk-report-writer
model: claude-sonnet-4-6
system: |
  你是報告寫入子 Agent，負責將風控分析結果格式化為最終報告。
  接收 risk-calculator 的計算結果，生成 Markdown 格式的結構化風控報告。
  輸出到 ./out/risk-report-{fund_id}-{date}.md
tools:
  - type: agent_toolset
    configs: [read, write, edit]   # 唯一有 write 的子 Agent
output_schema:
  type: object
  properties:
    report_path: {type: string}
    summary:     {type: string}
    compliant:   {type: boolean}
    breaches:    {type: array, items: {type: string}}
