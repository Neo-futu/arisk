# 數據讀取子 Agent — 只讀，無寫入
name: risk-data-reader
model: claude-sonnet-4-6
system: |
  你是數據讀取子 Agent，負責從 ARISK processing API 拉取原始數據。
  只做數據獲取，不做分析和計算。返回 JSON 格式數據。
  可調用工具：get_exposure, get_positions, get_nav_history
tools:
  - type: agent_toolset
    configs: [read, grep]
fsi_tools:
  - get_exposure
  - get_positions
  - get_nav_history
