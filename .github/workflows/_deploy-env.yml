# 可复用单环境部署工作流：被 deploy.yml 按 dev -> staging -> prod 顺序调用。
# 输入 env / env_pascal / gh_environment；其余从仓库与 Environment 级 Variables 读取。
name: _deploy-env

on:
  workflow_call:
    inputs:
      env:
        description: "dev / staging / prod"
        required: true
        type: string
      env_pascal:
        description: "Development / Staging / Production"
        required: true
        type: string
      gh_environment:
        description: "GitHub Environment 名（development/staging/production-app）"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}   # prod=production-app 在此处触发审批门控
    env:
      APP_NAME: ${{ vars.APP_NAME }}
      REPO_PASCAL: ${{ vars.REPO_PASCAL }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-east-1' }}
      # 各 Environment 级 Variable，运维接入时填本环境业务账号 ID（也可改为公开的 landing-zone 映射）。
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.6.2"

      # 经 OIDC 假设本应用部署角色 AppDeployRole-<RepoPascal>-<EnvPascal>。
      # 角色 ARN 由账号 ID + 命名约定拼出（账号 ID 取自 Environment 变量）。
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/AppDeployRole-${{ env.REPO_PASCAL }}-${{ inputs.env_pascal }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ env.APP_NAME }}-${{ inputs.env }}-gha

      # 从 SSM 读权威部署角色 ARN，作为 provider assume_role 的入参（与上面假设的身份一致）。
      - name: Resolve deploy role ARN from SSM
        id: ssm
        run: |
          ROLE_ARN=$(aws ssm get-parameter \
            --name "/infra/bl/${{ inputs.env }}/ap-east-1/platform/role-app-deploy-${REPO_PASCAL}-${{ inputs.env_pascal }}-arn" \
            --query 'Parameter.Value' --output text --region "${AWS_REGION}")
          echo "deploy_role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"

      # 生成 partial backend config（不入仓）。
      - name: Write backend config
        run: |
          cat > iac/backend.${{ inputs.env }}.hcl <<EOF
          bucket         = "balance-tf-state-${{ inputs.env }}-ap-east-1"
          key            = "app/${APP_NAME}/${{ inputs.env }}/terraform.tfstate"
          workspace_key_prefix = "app/${APP_NAME}/${{ inputs.env }}/workspaces"
          region         = "ap-east-1"
          dynamodb_table = "balance-tf-locks-${{ inputs.env }}-ap-east-1"
          encrypt        = true
          EOF

      - name: Tofu init
        working-directory: iac
        run: tofu init -backend-config=backend.${{ inputs.env }}.hcl

      - name: Tofu plan
        working-directory: iac
        run: |
          tofu plan -input=false -out=tfplan \
            -var="app_name=${APP_NAME}" \
            -var="repo_pascal=${REPO_PASCAL}" \
            -var="env=${{ inputs.env }}" \
            -var="region=${AWS_REGION}" \
            -var="deploy_role_arn=${{ steps.ssm.outputs.deploy_role_arn }}"

      - name: Tofu apply
        working-directory: iac
        run: tofu apply -input=false -auto-approve tfplan
